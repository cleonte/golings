version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowed-packages:
                # The matchers are meant to be used without a prefix.
                - github.com/onsi/gomega
                - github.com/onsi/ginkgo/v2
formatters:
  enable:
    - gofmt
