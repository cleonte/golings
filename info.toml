Since Go 1.22 a `ServeMux` pattern can start with a method and contain wildcards: `"GET /items/{id}"`. The handler reads the wildcard with `r.PathValue("id")`. A request with another method for a path that matches gets `405 Method Not Allowed` from the mux itself.

For more information: https://pkg.go.dev/net/http#ServeMux"""

[[exercises]]
