[[exercises]]
name = "closures1"
path = "exercises/closures/closures1/main.go"
mode = "compile"
hint = """
The type of the returned function is func() int, so the function you return has to match it: it must declare and return an int. It still uses count from newCounter, even though newCounter has already returned.

For more information: https://go.dev/tour/moretypes/25"""

[[exercises]]
name = "closures2"
path = "exercises/closures/closures2/main_test.go"
mode = "test"
hint = """
count lives outside newCounter, so every counter changes the same variable. Declare the variable inside newCounter: each call then creates a new one, and only the function returned by that call can see it.

For more information: https://go.dev/ref/spec#Function_literals"""

[[exercises]]
name = "closures3"
path = "exercises/closures/closures3/main_test.go"
mode = "test"
hint = """
total := total + amount declares a new variable called total, which hides the one balance reads. Assign to the existing variable instead: total += amount.

For more information: https://go.dev/doc/effective_go#redeclaration"""

[[exercises]]
name = "closures4"
path = "exercises/closures/closures4/main_test.go"
mode = "test"
hint = """
The variable n is declared before the loop, so there is only one, and every adder reads it after the loop has finished. Declare the number in the for statement instead, for i, n := range numbers: Go 1.22 gives each iteration its own n.

For more information: https://go.dev/blog/loopvar-preview"""

[[exercises]]
name = "closures5"
path = "exercises/closures/closures5/main_test.go"
mode = "test"
hint = """
A function can return another function that uses its parameters: multiplier's result multiplies by factor. For counted, make a counter variable inside it. The wrapped function increments it and calls fn, and calls returns it.

For more information: https://go.dev/ref/spec#Function_literals"""

[[exercises]]
name = "defer1"
path = "exercises/defer/defer1/main.go"
mode = "compile"
hint = """
defer needs a function call. A function literal on its own is only a value: call it by adding parentheses after the closing brace.

For more information: https://go.dev/ref/spec#Defer_statements"""

[[exercises]]
name = "defer2"
path = "exercises/defer/defer2/main_test.go"
mode = "test"
hint = """
Deferred calls run last in, first out. The usual way to get the right order is to defer the clean-up right after the line that needs it: open the file, defer closing it, then open the connection, defer closing that.

For more information: https://go.dev/tour/flowcontrol/13"""

[[exercises]]
name = "defer3"
path = "exercises/defer/defer3/main_test.go"
mode = "test"
hint = """
The arguments of a deferred call are evaluated when the defer statement runs, so the deferred call keeps the value x had back then. A deferred function literal is different: it reads x when it runs. Wrap the call in one, and call it.

For more information: https://go.dev/blog/defer-panic-and-recover"""

[[exercises]]
name = "defer4"
path = "exercises/defer/defer4/main_test.go"
mode = "test"
hint = """
A defer inside a loop waits until the whole function returns, so every resource stays open until then. Move the body of the loop into a function of its own: its deferred call runs when that function returns, which is once per iteration.

For more information: https://go.dev/doc/effective_go#defer"""

[[exercises]]
name = "defer5"
path = "exercises/defer/defer5/main_test.go"
mode = "test"
hint = """
recover only works inside a deferred function. Defer a function literal that calls recover, and when it returns something other than nil assign an error to the named result err. Do the division after the defer statement.

For more information: https://go.dev/blog/defer-panic-and-recover"""

[[exercises]]
name = "defer6"
path = "exercises/defer/defer6/main_test.go"
mode = "test"
hint = """
Because err is a named result, a deferred function runs after the return statement has set it and can change it again. Defer a function literal that wraps err with fmt.Errorf and %w, only if err is not nil. Do the work after the defer statement.

For more information: https://go.dev/ref/spec#Return_statements"""

[[exercises]]
name = "testing1"
path = "exercises/testing/testing1/main_test.go"
mode = "test"
hint = """
t.Run(name, func(t *testing.T) { ... }) runs a subtest with that name. Call the check inside it, with the case. The subtest gets its own *testing.T, so a failure is reported under the name of the case.

For more information: https://go.dev/blog/subtests"""

[[exercises]]
name = "testing2"
path = "exercises/testing/testing2/main_test.go"
mode = "test"
hint = """
t.Helper() tells the testing package that this function is a helper, so a failure is reported at the line of the test that called it. Call it first. Logging is not failing: use t.Errorf to mark the test as failed.

For more information: https://pkg.go.dev/testing#T.Helper"""

[[exercises]]
name = "testing3"
path = "exercises/testing/testing3/main_test.go"
mode = "test"
hint = """
t.TempDir() returns a new folder for the test and removes it, with everything in it, when the test and its subtests are over. You do not need os.MkdirTemp anymore. Without it, t.Cleanup(func) registers a function to run at the end of the test.

For more information: https://pkg.go.dev/testing#T.TempDir"""

[[exercises]]
name = "testing4"
path = "exercises/testing/testing4/main_test.go"
mode = "test"
hint = """
go test runs an example and compares what it prints with the comment that starts with Output: at the end of the function. Read the failure: it shows what the example printed and what the comment says. Whitespace around the output is ignored, the rest has to match.

For more information: https://go.dev/blog/examples"""

[[exercises]]
name = "testing5"
path = "exercises/testing/testing5/main_test.go"
mode = "test"
hint = """
for b.Loop() { ... } replaces for i := 0; i < b.N; i++ { ... }. The benchmark function then runs once, so the setup before the loop is not repeated, and the timer only counts the loop.

For more information: https://go.dev/blog/testing-b-loop"""

[[exercises]]
name = "slog1"
path = "exercises/slog/slog1/main_test.go"
mode = "test"
hint = """
`log/slog` writes structured logs: a message plus key/value pairs, `logger.Info("user logged in", "user", "ana", "attempts", 3)`. Don't build the text with `fmt.Sprintf`: separate fields can be searched and filtered by the tools that read the logs, a sentence can't.

For more information: https://pkg.go.dev/log/slog"""

[[exercises]]
name = "slog2"
path = "exercises/slog/slog2/main_test.go"
mode = "test"
hint = """
A handler decides how records are written and which are kept. `slog.NewJSONHandler` writes one JSON object per record, which is what log collectors expect; `slog.NewTextHandler` writes `key=value` text. Records below the handler's level are dropped, and the default level is Info: set `HandlerOptions.Level` to `slog.LevelDebug` to see debug records.

For more information: https://pkg.go.dev/log/slog#HandlerOptions"""

[[exercises]]
name = "slog3"
path = "exercises/slog/slog3/main_test.go"
mode = "test"
hint = """
`logger.With("order_id", 7)` returns a new logger that adds those pairs to every record it writes, so you don't repeat them at each call. `slog.Group("customer", "name", "ana")` nests pairs under a name: the text handler writes `customer.name=ana`, the JSON handler an object.

For more information: https://pkg.go.dev/log/slog#Logger.With"""

[[exercises]]
name = "slog4"
path = "exercises/slog/slog4/main_test.go"
mode = "test"
hint = """
`HandlerOptions.ReplaceAttr` is called for every attribute before it is written. It can change the value (to hide a secret), return an empty `slog.Attr{}` to drop the attribute (the time, say), or rename it. The first argument is the group the attribute is in, `a.Key` its key.

For more information: https://pkg.go.dev/log/slog#HandlerOptions"""

[[exercises]]
name = "json1"
path = "exercises/json/json1/main_test.go"
mode = "test"
hint = """
Struct tags say how a field is written by `encoding/json`: `json:"name"` names it (otherwise the Go name `Name` is used, capitalised), `json:"email,omitempty"` leaves it out when it is empty, and `json:"-"` never writes it. Only exported fields are written at all.

For more information: https://pkg.go.dev/encoding/json#Marshal"""

[[exercises]]
name = "json2"
path = "exercises/json/json2/main_test.go"
mode = "test"
hint = """
`omitempty` leaves out empty values: false, 0, nil, an empty string or slice. But a struct is never "empty", so a `time.Time` that was not set is still written (as year 1). The `omitzero` tag option (Go 1.24) leaves out any field that is the zero value of its type, structs included, and it uses an `IsZero()` method when the type has one, like time.Time.

For more information: https://go.dev/doc/go1.24#encodingjsonpkgencodingjson"""

[[exercises]]
name = "io1"
path = "exercises/io/io1/main_test.go"
mode = "test"
hint = """
A `Read` call fills the buffer with up to `len(buf)` bytes and returns how many it put there; it may return fewer, and returns `io.EOF` only when there is nothing more. To get everything, call `io.ReadAll(r)`, which keeps reading until `io.EOF`.

For more information: https://pkg.go.dev/io#ReadAll"""

[[exercises]]
name = "io2"
path = "exercises/io/io2/main_test.go"
mode = "test"
hint = """
`io.Writer` is the interface with one method, `Write([]byte) (int, error)`. Files, network connections, `bytes.Buffer` and `strings.Builder` all implement it. `fmt.Printf(...)` is `fmt.Fprintf(os.Stdout, ...)`; give `Fprintf` your own writer first, and the same code can print, write a file or fill a buffer in a test.

For more information: https://pkg.go.dev/fmt#Fprintf"""

[[exercises]]
name = "io3"
path = "exercises/io/io3/main_test.go"
mode = "test"
hint = """
`scanner.Scan()` returns false when it is done, and also when it failed. `scanner.Err()` returns the error, or nil at the end of the input. The default limit for a line is 64 KiB (`bufio.MaxScanTokenSize`); `scanner.Buffer` raises it. Always check `Err()` after the loop.

For more information: https://pkg.go.dev/bufio#Scanner.Err"""

[[exercises]]
name = "io4"
path = "exercises/io/io4/main_test.go"
mode = "test"
hint = """
`io.LimitReader(r, n)` returns a reader that gives at most `n` bytes of `r` and then reports `io.EOF`. Combined with `io.Copy(dst, src)`, which copies until the end of `src` and returns the number of bytes, it limits a copy without any loop of your own.

For more information: https://pkg.go.dev/io#LimitReader"""

[[exercises]]
name = "io5"
path = "exercises/io/io5/main_test.go"
mode = "test"
hint = """
A reader can be consumed once. Do both things in that one pass: `io.MultiWriter(dst, h)` is a writer that writes to every writer it was given, so `io.Copy(io.MultiWriter(dst, h), src)` copies and hashes together. `io.TeeReader(src, h)` does the same from the reading side. A hash implements `io.Writer`.

For more information: https://pkg.go.dev/io#MultiWriter"""

[[exercises]]
name = "io6"
path = "exercises/io/io6/main_test.go"
mode = "test"
hint = """
A `Reader` is any type with `Read(p []byte) (n int, err error)`. A reader that wraps another one calls the inner `Read(p)` and then works on `p[:n]`, only the bytes that were read: the rest of `p` is whatever it held before. Pass on `n` and `err` as they came, so the end of the input and any error reach the caller.

For more information: https://pkg.go.dev/io#Reader"""

[[exercises]]
name = "fs1"
path = "exercises/fs/fs1/main_test.go"
mode = "test"
hint = """
The error from `os.ReadFile` says what went wrong, and a missing file is only one of the possibilities. `errors.Is(err, fs.ErrNotExist)` is true when the file does not exist (the `os` package's old `os.IsNotExist` does the same). Return the default for that error, and pass any other error on.

For more information: https://pkg.go.dev/io/fs#pkg-variables"""

[[exercises]]
name = "fs2"
path = "exercises/fs/fs2/main_test.go"
mode = "test"
hint = """
`fs.FS` is the interface for a read-only file system: `os.DirFS(dir)` is one backed by a folder, `fstest.MapFS` one in memory, and `embed.FS` one inside the binary. `fs.WalkDir(fsys, ".", func(path string, d fs.DirEntry, err error) error { ... })` visits every file and folder below a root; `d.IsDir()` and `d.Name()` tell what each entry is. Code that takes an `fs.FS` can be tested without touching the disk.

For more information: https://pkg.go.dev/io/fs#WalkDir"""

[[exercises]]
name = "fs3"
path = "exercises/fs/fs3/main_test.go"
mode = "test"
hint = """
A walk function can return `fs.SkipDir` to skip the rest of the folder it was called for (when the entry is a folder), or `fs.SkipAll` to stop the walk. Both are values from `io/fs`, and `filepath.WalkDir` understands them like `fs.WalkDir` does. Skipping a folder is much cheaper than visiting its files and ignoring them.

For more information: https://pkg.go.dev/io/fs#SkipDir"""

[[exercises]]
name = "fs4"
path = "exercises/fs/fs4/main_test.go"
mode = "test"
hint = """
`filepath.Join(dir, "../secret.txt")` is a path outside `dir`, and `os.ReadFile` is glad to read it. `os.OpenRoot(dir)` returns an `*os.Root` whose methods (`Open`, `ReadFile`, `Create`, ...) refuse any name that leaves the folder, through `..` or through a symbolic link. Close it when done.

For more information: https://pkg.go.dev/os#Root"""

[[exercises]]
name = "fs5"
path = "exercises/fs/fs5/main_test.go"
mode = "test"
hint = """
A pattern passed to `fs.Glob(fsys, pattern)` is matched against paths from the root of `fsys`, and `*` does not cross a `/`. `fs.Sub(fsys, "assets/css")` returns a file system rooted at that sub-folder, so inside it `*.css` finds the style sheets and the names are relative to the folder.

For more information: https://pkg.go.dev/io/fs#Sub"""

[[exercises]]
name = "generics1"
path = "exercises/generics/generics1/main.go"
mode = "compile"
hint = """
Generic functions prevent code duplication by allowing the same function to handle different types.

Types are defined using syntax like:

func FuncName[T any](value T) {

}
"""

[[exercises]]
name = "generics2"
path = "exercises/generics/generics2/main.go"
mode = "compile"
hint = """
Type mismatches in arithmetic operations are not allowed, but generics enable functions to handle different types while maintaining the same logic.

In Go, type constraints can be declared. For this exercise, the `Number` interface is an example.

Ensure you include the appropriate type signature.
"""

[[exercises]]
name = "generics3"
path = "exercises/generics/generics3/main.go"
mode = "compile"
hint = """
A type constraint lists what a type parameter can be. Two things trip people up. `T any` allows every type, so you can't compare values with `>`: use `cmp.Ordered`, which is every type that can be ordered (numbers and strings). And `int | float64` lists exactly those types, not types built on them such as `type Celsius float64`: put a `~` in front to accept every type whose underlying type is that one.

For more information: https://pkg.go.dev/cmp#Ordered"""

[[exercises]]
name = "generics4"
path = "exercises/generics/generics4/main_test.go"
mode = "test"
hint = """
A generic struct has type parameters after its name: `Stack[T any]`, and every method repeats them in the receiver: `func (s *Stack[T]) Push(item T)`. Inside, T is a real type. To return "nothing" for a type you don't know, declare a variable of it: `var zero T` is the zero value of T, whatever T is.

For more information: https://go.dev/blog/intro-generics"""

[[exercises]]
name = "generics5"
path = "exercises/generics/generics5/main.go"
mode = "compile"
hint = """
`T any` lets a function take every type, which is why it can't do much with the values: not even `==`, because some types (slices, maps, functions) can't be compared. The `comparable` constraint says T supports `==` and `!=`: use it when you need to find or count equal values, or use T as a map key.

For more information: https://go.dev/blog/comparable"""

[[exercises]]
name = "generics6"
path = "exercises/generics/generics6/main.go"
mode = "compile"
hint = """
Since Go 1.24 a type alias can have type parameters. `type Set[T comparable] = map[T]struct{}` makes `Set[string]` another name for `map[string]struct{}`: the two are the same type, so values go from one to the other without a conversion. Without the `[T comparable]` the alias has no T to use.

For more information: https://go.dev/blog/go1.24#generic-type-aliases"""

[[exercises]]
name = "generics7"
path = "exercises/generics/generics7/main.go"
mode = "compile"
hint = """
Some constraints talk about the type itself: "A can be added to another A". For that, the constraint of `A` has to name `A`: `type Adder[A Adder[A]] interface { Add(A) A }`. Before Go 1.26 a generic type could not refer to itself in its own type parameter list, you had to work around it; now you can.

For more information: https://go.dev/doc/go1.26#language"""

[[exercises]]
name = "iterators1"
path = "exercises/iterators/iterators1/main_test.go"
mode = "test"
hint = """
An iterator is a function that gets a `yield` function and calls it once for every value, in order. `iter.Seq[V]` is the type of such a function: `func(yield func(V) bool)`. Write one by looping and passing each value to `yield`. `yield` returns false when whoever is ranging stopped early: then you must return.

For more information: https://pkg.go.dev/iter"""

[[exercises]]
name = "iterators2"
path = "exercises/iterators/iterators2/main.go"
mode = "compile"
hint = """
You can range over an iterator like over a slice: `for fruit := range fruits()`. An `iter.Seq[V]` gives one value per round. An `iter.Seq2[K, V]` gives two, like `slices.All` does with the index and the value, and then you write two variables.

For more information: https://go.dev/blog/range-functions"""

[[exercises]]
name = "iterators3"
path = "exercises/iterators/iterators3/main_test.go"
mode = "test"
hint = """
`iter.Seq2[K, V]` is an iterator that gives two values at a time: its `yield` takes two arguments, `yield(key, value)`. It is what you use for pairs, such as an index and a value, or a key and a value.

For more information: https://pkg.go.dev/iter#Seq2"""

[[exercises]]
name = "iterators4"
path = "exercises/iterators/iterators4/main_test.go"
mode = "test"
hint = """
`yield` returns false when the loop that is ranging over your iterator has stopped, with `break` or `return`. You have to stop too: `if !yield(value) { return }`. If you keep calling yield, Go panics with "range function continued iteration after function for loop body returned false". This matters most for iterators that never end.

For more information: https://go.dev/blog/range-functions"""

[[exercises]]
name = "iterators5"
path = "exercises/iterators/iterators5/main_test.go"
mode = "test"
hint = """
Iterators compose: a function can take an `iter.Seq` and give another one. The standard library offers the pieces around it: `slices.Values` turns a slice into an iterator, `maps.Keys` gives the keys of a map, and `slices.Collect` or `slices.Sorted` turn an iterator back into a slice. Writing the middle part, a filter, is a loop over the input that calls `yield` for the values you keep.

For more information: https://pkg.go.dev/slices#Collect"""

[[exercises]]
name = "time1"
path = "exercises/time/time1/main.go"
mode = "compile"
hint = """
A `time.Duration` is a count of nanoseconds with its own type, and Go does not mix types in arithmetic: `retries * time.Second` multiplies an `int` by a `Duration`. Convert the number, `time.Duration(retries) * time.Second`. The constants (`time.Second`, `time.Minute`) are typed, so `3 * time.Second` works because `3` is an untyped constant.

For more information: https://pkg.go.dev/time#Duration"""

[[exercises]]
name = "time2"
path = "exercises/time/time2/main_test.go"
mode = "test"
hint = """
Go formats times with an example, not with codes: the layout is the reference time `Mon Jan 2 15:04:05 MST 2006` (01/02 03:04:05PM '06 -0700), with the parts you want, written the way they should look. `Mon` is the short weekday, `02` the day with a zero, `Jan` the short month, `2006` the year, `15:04` the 24-hour clock.

For more information: https://pkg.go.dev/time#pkg-constants"""

[[exercises]]
name = "time3"
path = "exercises/time/time3/main_test.go"
mode = "test"
hint = """
`time.Parse` has no zone to use when the text has none, and takes UTC. `time.ParseInLocation(layout, text, zone)` reads the same text as a time in `zone`. Then `.UTC()` gives the same instant, written in UTC. A date like the 30th of February is an error from both.

For more information: https://pkg.go.dev/time#ParseInLocation"""

[[exercises]]
name = "time4"
path = "exercises/time/time4/main_test.go"
mode = "test"
hint = """
`Truncate(d)` rounds down to a multiple of `d` since the zero time, which is in UTC, so for a day it gives midnight in UTC, not midnight where `t` lives. Take the parts with `year, month, day := t.Date()` and build the time with `time.Date(year, month, day, 0, 0, 0, 0, t.Location())`.

For more information: https://pkg.go.dev/time#Time.Truncate"""

[[exercises]]
name = "time5"
path = "exercises/time/time5/main_test.go"
mode = "test"
hint = """
`==` on a `time.Time` compares every field: the instant, the location pointer and the monotonic clock reading. Two values for the same moment in different zones are not `==`. `a.Equal(b)` compares only the instant; `Before` and `After` do too.

For more information: https://pkg.go.dev/time#Time.Equal"""

[[exercises]]
name = "time6"
path = "exercises/time/time6/main_test.go"
mode = "test"
hint = """
`time.AfterFunc(d, f)` returns a `*time.Timer` that runs `f` after `d`. Keep it in the struct. `timer.Reset(d)` moves it back to a full `d` from now, which is what makes a burst of triggers one call. The test runs in `synctest.Test`, where the clock is fake: the sleeps cost nothing.

For more information: https://pkg.go.dev/time#Timer.Reset"""

[[exercises]]
name = "concurrent1"
path = "exercises/concurrent/concurrent1/main_test.go"
mode = "test"
hint = """
We have multiple printers (though these may also be non-functional).

Our goal is to print something, but what exactly should be printed?
"""

[[exercises]]
name = "concurrent2"
path = "exercises/concurrent/concurrent2/main_test.go"
mode = "test"
race = true
hint = """
Updating a variable from multiple goroutines can lead to a data race. A data race occurs when multiple goroutines read and write the same variable simultaneously without proper synchronization.

Consider a counter as an example: concurrent updates can lead to unexpected results.

Learn more about mutexes to handle this issue: https://pkg.go.dev/sync#Mutex.
"""

[[exercises]]
name = "concurrent3"
path = "exercises/concurrent/concurrent3/main_test.go"
mode = "test"
hint = """
Writing messages to closed channels will cause a panic.

To prevent panics, avoid sending messages to channels that have been closed.

Note: Channels can be iterated using `for-range` loops.
"""

[[exercises]]
name = "concurrent4"
path = "exercises/concurrent/concurrent4/main_test.go"
mode = "test"
hint = """
A send on an unbuffered channel waits until another goroutine receives, and here the same goroutine would do the receiving later: it deadlocks. A buffered channel, make(chan int, size), accepts that many values without a receiver.

For more information: https://go.dev/tour/concurrency/3"""

[[exercises]]
name = "concurrent5"
path = "exercises/concurrent/concurrent5/main_test.go"
mode = "test"
hint = """
go starts a goroutine and carries on without waiting for it, so squares can return before the goroutines have written their results. The WaitGroup counts them: wg.Wait() blocks until every wg.Done() has been called.

For more information: https://pkg.go.dev/sync#WaitGroup"""

[[exercises]]
name = "concurrent6"
path = "exercises/concurrent/concurrent6/main_test.go"
mode = "test"
hint = """
select waits on several channel operations and runs the one that is ready first. time.After(limit) returns a channel that receives a value once the limit has passed: use it as the second case.

For more information: https://go.dev/tour/concurrency/5"""

[[exercises]]
name = "concurrent7"
path = "exercises/concurrent/concurrent7/main_test.go"
mode = "test"
hint = """
A plain send blocks until someone receives, so a cancelled spin would stay stuck on it. Put the send in a select with a second case that receives from ctx.Done(), and return from that case.

For more information: https://go.dev/blog/context"""

[[exercises]]
name = "concurrent8"
path = "exercises/concurrent/concurrent8/main_test.go"
mode = "test"
hint = """
A worker pool is a fixed number of goroutines that all read from the same jobs channel, and send their results on another. Close the jobs channel when there are no more jobs so that the workers' range loops end, and close the results channel after a WaitGroup says all the workers are done.

For more information: https://go.dev/blog/pipelines"""

[[exercises]]
name = "concurrent9"
path = "exercises/concurrent/concurrent9/main_test.go"
mode = "test"
hint = """
Start one goroutine per input, each forwarding its values to out, so that a slow input does not hold up the others. Count them with a WaitGroup, and close out in one more goroutine that waits for the group.

For more information: https://go.dev/blog/pipelines"""

[[exercises]]
name = "concurrent10"
path = "exercises/concurrent/concurrent10/main_test.go"
mode = "test"
race = true
hint = """
Checking a flag and then setting it is not safe when many goroutines do it at the same time: two of them can both see it unset. sync.Once runs a function exactly once, however many goroutines call Do, and everyone waits for it to finish.

For more information: https://pkg.go.dev/sync#Once"""

[[exercises]]
name = "concurrent11"
path = "exercises/concurrent/concurrent11/main_test.go"
mode = "test"
hint = """
Since Go 1.25, `wg.Go(f)` starts `f` in a new goroutine and does the `wg.Add(1)` before and the `wg.Done()` after for you, so you can't forget one of them. You still call `wg.Wait()` to wait for all of them.

For more information: https://pkg.go.dev/sync#WaitGroup.Go"""

[[exercises]]
name = "concurrent12"
path = "exercises/concurrent/concurrent12/main_test.go"
mode = "test"
hint = """
Tests that wait for time are slow and flaky. `synctest.Test(t, f)` (Go 1.25) runs `f` in a bubble with a fake clock: when every goroutine in the bubble is blocked, time jumps ahead to the next timer, so `time.Sleep(time.Hour)` takes no real time. `synctest.Wait()` waits until all the other goroutines of the bubble are blocked, and it only works inside a bubble.

For more information: https://go.dev/blog/testing-time"""

[[exercises]]
name = "concurrent13"
path = "exercises/concurrent/concurrent13/main_test.go"
mode = "test"
go_version = "1.27"
hint = """
`synctest.Sleep(d)` (Go 1.27) is `time.Sleep(d)` followed by `synctest.Wait()`. After a plain sleep, a goroutine that sleeps for the same time is woken at the same instant and it is not decided which of the two runs first, so the test may look before that goroutine did its work. `synctest.Sleep` also waits until the other goroutines of the bubble have run as far as they can, so you see what they did.

For more information: https://pkg.go.dev/testing/synctest#Sleep"""

[[exercises]]
name = "concurrent14"
path = "exercises/concurrent/concurrent14/main_test.go"
mode = "test"
hint = """
`context.WithTimeout(parent, d)` returns a context that is cancelled by itself after `d`, and a `cancel` function. Call `cancel` when you are done (`defer cancel()`) so the timer is released. Code that waits on `ctx.Done()` stops, and `ctx.Err()` says why: `context.DeadlineExceeded` for a timeout, `context.Canceled` after a call to `cancel`. `context.WithDeadline` does the same with a point in time instead of a duration.

For more information: https://pkg.go.dev/context#WithTimeout"""

[[exercises]]
name = "concurrent15"
path = "exercises/concurrent/concurrent15/main_test.go"
mode = "test"
hint = """
Starting a goroutine for every task is fine until there are thousands of them, or each one opens a connection. A buffered channel makes a simple limit, a semaphore: send to it before starting a task (this blocks while the channel is full) and receive from it when the task is done to free the slot. The capacity is the number of tasks that may run at once.

For more information: https://go.dev/wiki/BoundingResourceUse"""

[[exercises]]
name = "concurrent16"
path = "exercises/concurrent/concurrent16/main_test.go"
mode = "test"
hint = """
Running tasks together and stopping them all when one fails is what `golang.org/x/sync/errgroup` does, and you can build it from the standard library. A context made with `context.WithCancelCause` is given to every task; the first task that fails stores its error and cancels the context, so the others, which wait on `ctx.Done()`, stop early. `sync.Once` makes "remember the first error only" safe when several tasks fail at the same time, and `sync.WaitGroup` waits for all of them.

For more information: https://pkg.go.dev/context#WithCancelCause"""

[[exercises]]
name = "concurrent17"
path = "exercises/concurrent/concurrent17/main_test.go"
mode = "test"
hint = """
A `sync.Mutex` lets one goroutine in at a time, even when they only read. `sync.RWMutex` has two kinds of lock: `RLock` and `RUnlock` for readers, any number of which can hold it together, and `Lock` and `Unlock` for a writer, which waits until nobody holds it and keeps everybody else out. It pays off when there are many more reads than writes, and the reads are not tiny.

For more information: https://pkg.go.dev/sync#RWMutex"""

[[exercises]]
name = "concurrent18"
path = "exercises/concurrent/concurrent18/main_test.go"
mode = "test"
hint = """
Checking a flag and then setting it are two steps, and other goroutines can get in between. The `sync/atomic` package does read-modify-write in one step: `Add` for counters, and `CompareAndSwap(old, new)`, which sets the value to `new` only if it is still `old` and tells you whether it did. When many goroutines call `CompareAndSwap(false, true)`, exactly one gets `true`.

For more information: https://pkg.go.dev/sync/atomic#Bool.CompareAndSwap"""

[[exercises]]
name = "context1"
path = "exercises/context/context1/main_test.go"
mode = "test"
hint = """
Sleep can't be interrupted: the goroutine is stuck in it until the second is over, whatever happens to ctx. Wait in a select instead, with one case for the time passing (`<-time.After(time.Second)`) and one for `<-ctx.Done()`; return in the second.

For more information: https://pkg.go.dev/context#Context"""

[[exercises]]
name = "context2"
path = "exercises/context/context2/main_test.go"
mode = "test"
hint = """
`context.WithTimeout(parent, d)` returns a child context that ends by itself after `d`, and a `cancel` function. Call `defer cancel()` right away: it releases the timer when `lookup` returns early. Pass the child to `slowLookup`; the error is `context.DeadlineExceeded`.

For more information: https://pkg.go.dev/context#WithTimeout"""

[[exercises]]
name = "context3"
path = "exercises/context/context3/main_test.go"
mode = "test"
hint = """
`WithValue` finds a value by comparing keys with `==`, and two strings with the same text are equal, wherever they come from. A key of a type of your own never equals anyone else's: declare `type contextKey int` (not exported) and constants of it, with `iota` if you like, and use them in both the `WithValue` and the `Value` calls.

For more information: https://pkg.go.dev/context#WithValue"""

[[exercises]]
name = "context4"
path = "exercises/context/context4/main_test.go"
mode = "test"
hint = """
`context.WithCancelCause(parent)` returns a `CancelCauseFunc`, which takes an error: `cancel(err)`. `ctx.Err()` is still `context.Canceled`, and `context.Cause(ctx)` returns the error that was given.

For more information: https://pkg.go.dev/context#WithCancelCause"""

[[exercises]]
name = "context5"
path = "exercises/context/context5/main_test.go"
mode = "test"
hint = """
`context.WithoutCancel(ctx)` returns a context that keeps every value of `ctx` but is never cancelled and has no deadline. It is meant for work that must finish even when the request is over, such as writing an audit entry.

For more information: https://pkg.go.dev/context#WithoutCancel"""

[[exercises]]
name = "context6"
path = "exercises/context/context6/main_test.go"
mode = "test"
hint = """
`context.AfterFunc(ctx, f)` arranges for `f` to run in its own goroutine once `ctx` is done, and returns a `stop func() bool`: it reports true if it stopped `f` from being started. A method value such as `c.Close` is a function you can pass.

For more information: https://pkg.go.dev/context#AfterFunc"""

[[exercises]]
name = "pitfalls1"
path = "exercises/pitfalls/pitfalls1/main_test.go"
mode = "test"
hint = """
A slice is a small header (a pointer to an array, a length and a capacity). `append` writes into the same array when there is room left (length below capacity), so two slices made with `append` from the same base can end up sharing, and overwriting, the same element. To get a slice of your own, copy into a new one (`slices.Clone`, or `make` and `copy`), or cap the capacity so `append` has to allocate: `base[:len(base):len(base)]`.

For more information: https://go.dev/blog/slices-intro"""

[[exercises]]
name = "pitfalls2"
path = "exercises/pitfalls/pitfalls2/main_test.go"
mode = "test"
hint = """
In `for _, p := range players`, `p` is a copy of the element, so changing it changes nothing in the slice. To change the elements, go through the index: `for i := range players { players[i].Score += 10 }`, or take a pointer to the element: `p := &players[i]`. The same is true for arrays and for maps of structs.

For more information: https://go.dev/ref/spec#For_range"""

[[exercises]]
name = "pitfalls3"
path = "exercises/pitfalls/pitfalls3/main_test.go"
mode = "test"
hint = """
`:=` declares new variables, and inside an `if` or a `for` that means new ones that hide the outer ones with the same name (they "shadow" them). `count, err := strconv.Atoi(text)` in an inner block makes an inner `count` and `err`, and when the block ends the function still has the outer ones, untouched. Use `=` to assign to the ones that already exist.

For more information: https://go.dev/ref/spec#Declarations_and_scope"""

[[exercises]]
name = "pitfalls4"
path = "exercises/pitfalls/pitfalls4/main_test.go"
mode = "test"
hint = """
The zero value of a map is `nil`. Reading from a nil map is fine, you get the zero value, but writing to one panics with `assignment to entry in nil map`. Make the map before you write: `make(map[string]int)` or a literal `map[string]int{}`. The same is not true of slices: appending to a nil slice works.

For more information: https://go.dev/blog/maps"""

[[exercises]]
name = "pitfalls5"
path = "exercises/pitfalls/pitfalls5/main_test.go"
mode = "test"
hint = """
A map has no order, and Go makes the order of `range` over a map different on purpose, so nobody relies on it. When the output has to be the same every time (a report, a test, a log line), get the keys, sort them, and go through the sorted keys. `slices.Sorted(maps.Keys(m))` does that in one line.

For more information: https://go.dev/blog/maps#iteration-order"""

[[exercises]]
name = "pitfalls6"
path = "exercises/pitfalls/pitfalls6/main_test.go"
mode = "test"
hint = """
Closing a channel that is already closed panics (`close of closed channel`), and so does sending on a closed one. When a method that closes a channel can be called more than once, make the close happen once: `sync.Once` runs a function exactly one time, however many times `Do` is called, from however many goroutines.

For more information: https://pkg.go.dev/sync#Once"""

[[exercises]]
name = "pitfalls7"
path = "exercises/pitfalls/pitfalls7/main_test.go"
mode = "test"
hint = """
A `sync.Mutex` (and everything that holds one) must not be copied after it is first used: the copy has its own lock state. A method with a value receiver, `func (c Counter) Inc()`, gets a copy of the whole struct on every call, so it locks and changes a copy and the real counter never changes. Use a pointer receiver, and pass such structs by pointer. `go vet` finds this with its `copylocks` check.

For more information: https://pkg.go.dev/sync#Mutex"""

[[exercises]]
name = "go127_1"
path = "exercises/go127/go127_1/main_test.go"
mode = "test"
go_version = "1.27"
hint = """
`strings.CutLast(s, sep)` (Go 1.27) splits a string around the last `sep`, like `strings.Cut` does around the first one. It returns the text before, the text after, and whether `sep` was found. When it is not found you get `s, "", false`: the whole string comes back as the "before" part, so check `found` when the other way round makes more sense. It replaces most uses of `strings.LastIndex`.

For more information: https://pkg.go.dev/strings#CutLast"""

[[exercises]]
name = "go127_2"
path = "exercises/go127/go127_2/main_test.go"
mode = "test"
go_version = "1.27"
hint = """
The new `uuid` package (Go 1.27) has the standard library generate and parse UUIDs, RFC 9562 identifiers like `123e4567-e89b-12d3-a456-426614174000`. `uuid.New()` returns a random one, `uuid.NewV7()` one that sorts by creation time, `uuid.Parse(text)` reads the text form and returns an error when it is not a UUID, and `String()` gives the text back. A `uuid.UUID` is an array of 16 bytes, so you can compare two with `==`.

For more information: https://pkg.go.dev/uuid"""

[[exercises]]
name = "go127_3"
path = "exercises/go127/go127_3/main_test.go"
mode = "test"
go_version = "1.27"
hint = """
A struct that embeds another gets the fields of the embedded struct as its own (they are "promoted"): `person.City` is `person.Address.City`. Until Go 1.27 a composite literal could not use them as keys, you had to write the embedded struct out: `Person{Address: Address{City: "Lisbon"}}`. Now the key can be a promoted field: `Person{Name: "Ana", City: "Lisbon"}`. The file needs `//go:build go1.27` at the top, because the module's language version is older; the exercise already has it.

For more information: https://go.dev/doc/go1.27#language"""

[[exercises]]
name = "go127_4"
path = "exercises/go127/go127_4/main.go"
mode = "compile"
go_version = "1.27"
hint = """
Go 1.27 lets a method declare type parameters of its own, after its name: `func (l List[T]) Map[U any](f func(T) U) List[U]`. Before, you had to write a function and pass the list in. `math/rand/v2` is the standard library example: `(*Rand).N` works for any integer type, `r.N(10 * time.Second)` gives a random Duration. The type parameters of the type (`T`) stay in the receiver, the ones of the method (`U`) go after the name. The file needs `//go:build go1.27` at the top, because the module's language version is older; the exercise already has it.

For more information: https://go.dev/doc/go1.27#language"""

[[exercises]]
name = "go127_5"
path = "exercises/go127/go127_5/main.go"
mode = "compile"
go_version = "1.27"
hint = """
A generic method has limits. An interface method can't have type parameters, and a method with type parameters can't be the one that makes a type implement an interface: `Get[T any](key string) T` is not the method `Get(key string) any` that the interface asks for. When you need both, keep the interface method plain and put the generic part in a function that takes the interface: `func GetAs[T any](s Store, key string) (T, bool)`. The file needs `//go:build go1.27` at the top; the exercise already has it.

For more information: https://go.dev/doc/go1.27#language"""

[[exercises]]
name = "go127_6"
path = "exercises/go127/go127_6/main_test.go"
mode = "test"
go_version = "1.27"
hint = """
`encoding/json/v2` (Go 1.27) is a new JSON package with the same two entry points, `json.Marshal(value)` and `json.Unmarshal(data, &value)`, and stricter, more interoperable defaults than the old `encoding/json`. Two differences you can see here: a nil slice (or map) is written as `[]` (or `{}`), where v1 writes `null`; and an object with the same name twice is an error, where v1 quietly keeps the last one. (JSON names are also matched case-sensitively.) `encoding/json` itself is built on v2 now, but keeps its old behavior.

For more information: https://pkg.go.dev/encoding/json/v2"""
