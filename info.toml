hint = """
A response is sent in order: the status line, the headers, then the body. The first `Write` sends the status line with `200 OK` if you haven't set one, and after that `WriteHeader` has no effect. Call `w.WriteHeader(http.StatusCreated)` (and set any headers) before writing the body.

For more information: https://pkg.go.dev/net/http#ResponseWriter"""

