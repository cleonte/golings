An `http.Client` has no timeout by default: it waits as long as the server does. Set `Timeout` when you create it, `&http.Client{Transport: rt, Timeout: 2 * time.Second}`; it covers the whole exchange, including reading the body. The test uses a fake transport and `synctest`, so the two seconds cost nothing.

For more information: https://pkg.go.dev/net/http#Client"""

[[exercises]]
