Iterators compose: a function can take an `iter.Seq` and give another one. The standard library offers the pieces around it: `slices.Values` turns a slice into an iterator, `maps.Keys` gives the keys of a map, and `slices.Collect` or `slices.Sorted` turn an iterator back into a slice. Writing the middle part, a filter, is a loop over the input that calls `yield` for the values you keep.

For more information: https://pkg.go.dev/slices#Collect"""

[[exercises]]
