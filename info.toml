An iterator is a function that gets a `yield` function and calls it once for every value, in order. `iter.Seq[V]` is the type of such a function: `func(yield func(V) bool)`. Write one by looping and passing each value to `yield`. `yield` returns false when whoever is ranging stopped early: then you must return.

For more information: https://pkg.go.dev/iter"""

