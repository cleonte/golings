mode = "test"
hint = """
Go passes arguments by value, so a function only changes a copy. To change the caller's variables, take pointers (*int) and pass the addresses (&n). Write through the pointer with *n. Change the calls in the tests too.

For more information: https://go.dev/ref/spec#Address_operators"""

[[exercises]]
name = "pointers3"
path = "exercises/pointers/pointers3/main_test.go"
mode = "test"
hint = """
&Person{...} creates a Person and gives you a pointer to it. On a pointer to a struct you can write p.Age directly, no need for (*p).Age.

For more information: https://go.dev/ref/spec#Composite_literals"""

[[exercises]]
name = "pointers4"
path = "exercises/pointers/pointers4/main_test.go"
mode = "test"
hint = """
Following a nil pointer panics. Compare the pointer with nil before using its fields, and return the greeting for nobody in that case.

For more information: https://go.dev/ref/spec#Pointer_types"""

[[exercises]]
name = "pointers5"
path = "exercises/pointers/pointers5/main.go"
mode = "compile"
hint = """
new(int) returns a *int. count++ would add one to the pointer itself, which is not allowed: add one to the value it points to instead.

For more information: https://go.dev/doc/effective_go#allocation_new"""

[[exercises]]
name = "pointers6"
path = "exercises/pointers/pointers6/main.go"
mode = "compile"
hint = """
Optional values in a struct are often pointers: nil means "not set". Before Go 1.26 you needed a variable or a helper function to get a pointer to a value, because `&3` is not allowed. Now `new` takes an expression: `new(3)` is a `*int` that points to 3, `new("fast")` a `*string`.

For more information: https://go.dev/doc/go1.26#language"""

