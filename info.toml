`iter.Seq2[K, V]` is an iterator that gives two values at a time: its `yield` takes two arguments, `yield(key, value)`. It is what you use for pairs, such as an index and a value, or a key and a value.

For more information: https://pkg.go.dev/iter#Seq2"""

[[exercises]]
name = "iterators4"
path = "exercises/iterators/iterators4/main_test.go"
mode = "test"
nudge = """The test panics with "range function continued iteration after function for loop body returned false": the iterator went on after the loop had stopped."""
stronger = """Check what yield returns, and return from the iterator when it is false."""
hint = """
`yield` returns false when the loop that is ranging over your iterator has stopped, with `break` or `return`. You have to stop too: `if !yield(value) { return }`. If you keep calling yield, Go panics with "range function continued iteration after function for loop body returned false". This matters most for iterators that never end.

For more information: https://go.dev/blog/range-functions"""

[[exercises]]
name = "iterators5"
path = "exercises/iterators/iterators5/main_test.go"
mode = "test"
nudge = """evens and evenIDs return empty slices: neither one filters anything yet."""
stronger = """In evens range over seq and call yield only for the even numbers, returning when yield says false. In evenIDs collect the filtered keys of the map into a sorted slice."""
