`container/heap` keeps a slice as a heap using the five methods of `heap.Interface` (`Len`, `Less`, `Swap`, `Push`, `Pop`). `heap.Pop` always returns the element for which `Less` says it is smaller than all the others, so for a queue where 1 is the most urgent, `Less(i, j)` is `q[i].priority < q[j].priority`.

