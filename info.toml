hint = """
`http.MaxBytesReader(w, r.Body, n)` returns a body that fails once more than `n` bytes have been read. The error is a `*http.MaxBytesError`, which you can find with `errors.As`, and the right answer is `http.StatusRequestEntityTooLarge` (413). Without a limit, one request can use all the memory of the server.

For more information: https://pkg.go.dev/net/http#MaxBytesReader"""

