You can range over an iterator like over a slice: `for fruit := range fruits()`. An `iter.Seq[V]` gives one value per round. An `iter.Seq2[K, V]` gives two, like `slices.All` does with the index and the value, and then you write two variables.

For more information: https://go.dev/blog/range-functions"""

