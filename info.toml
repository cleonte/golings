mode = "compile"
nudge = """The compiler says value is undefined: the function has no parameter called value yet, of any type."""
stronger = """Add a type parameter in square brackets after the name of the function, constrained with any, and use it as the type of the parameter value."""
hint = """
Generic functions prevent code duplication by allowing the same function to handle different types.

Types are defined using syntax like:

func FuncName[T any](value T) {

}
"""

[[exercises]]
name = "generics2"
path = "exercises/generics/generics2/main.go"
mode = "compile"
nudge = """The compiler says addNumbers returns no value and T is undefined: the function isn't generic yet and has no result type."""
stronger = """Declare T in square brackets after the name, with the Number constraint, use T for the parameters and the result, and add the floating-point types to Number."""
hint = """
Type mismatches in arithmetic operations are not allowed, but generics enable functions to handle different types while maintaining the same logic.

In Go, type constraints can be declared. For this exercise, the `Number` interface is an example.

Ensure you include the appropriate type signature.
"""

[[exercises]]
name = "generics3"
path = "exercises/generics/generics3/main.go"
mode = "compile"
nudge = """The compiler says T can't use > and that Celsius does not satisfy Number: any allows no comparison, and Number lists float64 but not the types built on it."""
stronger = """Put ~ before float64 in Number so that types whose underlying type is float64 are accepted, and constrain the function that compares with the constraint for ordered types from the cmp package."""
hint = """
A type constraint lists what a type parameter can be. Two things trip people up. `T any` allows every type, so you can't compare values with `>`: use `cmp.Ordered`, which is every type that can be ordered (numbers and strings). And `int | float64` lists exactly those types, not types built on them such as `type Celsius float64`: put a `~` in front to accept every type whose underlying type is that one.

For more information: https://pkg.go.dev/cmp#Ordered"""

[[exercises]]
name = "generics4"
path = "exercises/generics/generics4/main_test.go"
mode = "test"
nudge = """Pop() returns 0 and false: Push and Pop don't do anything yet."""
stronger = """Push appends the item to the slice inside the stack. Pop returns the zero value of T and false for an empty stack; otherwise it takes the last item off the slice and returns it with true."""
hint = """
A generic struct has type parameters after its name: `Stack[T any]`, and every method repeats them in the receiver: `func (s *Stack[T]) Push(item T)`. Inside, T is a real type. To return "nothing" for a type you don't know, declare a variable of it: `var zero T` is the zero value of T, whatever T is.

For more information: https://go.dev/blog/intro-generics"""

[[exercises]]
name = "generics5"
path = "exercises/generics/generics5/main.go"
mode = "compile"
nudge = """The compiler says item == target is invalid for incomparable types, and that T is not a valid map key: any allows types that can't be compared."""
stronger = """Change the constraint of T, in both places, to the built-in constraint for the types that support == and !=."""
hint = """
`T any` lets a function take every type, which is why it can't do much with the values: not even `==`, because some types (slices, maps, functions) can't be compared. The `comparable` constraint says T supports `==` and `!=`: use it when you need to find or count equal values, or use T as a map key.

For more information: https://go.dev/blog/comparable"""

[[exercises]]
name = "generics6"
path = "exercises/generics/generics6/main.go"
mode = "compile"
nudge = """The compiler says T is undefined and Set is not a generic type: the alias has no type parameter."""
stronger = """Add a type parameter in square brackets after the name of the alias, with a constraint that allows it to be a map key."""
hint = """
Since Go 1.24 a type alias can have type parameters. `type Set[T comparable] = map[T]struct{}` makes `Set[string]` another name for `map[string]struct{}`: the two are the same type, so values go from one to the other without a conversion. Without the `[T comparable]` the alias has no T to use.

For more information: https://go.dev/blog/go1.24#generic-type-aliases"""

[[exercises]]
name = "generics7"
path = "exercises/generics/generics7/main.go"
mode = "compile"
nudge = """The compiler says A is undefined and Adder is not a generic type: neither the interface nor the function declares a type parameter."""
stronger = """Declare A in square brackets after the name of the interface, with a constraint that refers to Adder[A] itself, and do the same in the function that adds the values."""
hint = """
Some constraints talk about the type itself: "A can be added to another A". For that, the constraint of `A` has to name `A`: `type Adder[A Adder[A]] interface { Add(A) A }`. Before Go 1.26 a generic type could not refer to itself in its own type parameter list, you had to work around it; now you can.

For more information: https://go.dev/doc/go1.26#language"""

