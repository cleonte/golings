Running tasks together and stopping them all when one fails is what `golang.org/x/sync/errgroup` does, and you can build it from the standard library. A context made with `context.WithCancelCause` is given to every task; the first task that fails stores its error and cancels the context, so the others, which wait on `ctx.Done()`, stop early. `sync.Once` makes "remember the first error only" safe when several tasks fail at the same time, and `sync.WaitGroup` waits for all of them.

For more information: https://pkg.go.dev/context#WithCancelCause"""

