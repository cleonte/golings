stronger = """Use the tag option that leaves out zero values of any kind, structs included, instead of omitempty."""
hint = """
`omitempty` leaves out empty values: false, 0, nil, an empty string or slice. But a struct is never "empty", so a `time.Time` that was not set is still written (as year 1). The `omitzero` tag option (Go 1.24) leaves out any field that is the zero value of its type, structs included, and it uses an `IsZero()` method when the type has one, like time.Time.

For more information: https://go.dev/doc/go1.24#encodingjsonpkgencodingjson"""

[[exercises]]
name = "io1"
path = "exercises/io/io1/main_test.go"
mode = "test"
nudge = """Only the first byte arrived: a single Read gives whatever the reader hands over at that moment, which may be less than what is left."""
stronger = """Replace the one Read and the buffer with the function of the io package that reads until the end, and convert its result to a string. Return its error too."""
hint = """
A `Read` call fills the buffer with up to `len(buf)` bytes and returns how many it put there; it may return fewer, and returns `io.EOF` only when there is nothing more. To get everything, call `io.ReadAll(r)`, which keeps reading until `io.EOF`.

For more information: https://pkg.go.dev/io#ReadAll"""

[[exercises]]
name = "io2"
path = "exercises/io/io2/main_test.go"
mode = "test"
nudge = """report wrote nothing to the writer: fmt.Printf prints on the standard output, which is not w."""
stronger = """Change the Printf line to the fmt function that takes an io.Writer as its first argument, and pass w."""
hint = """
`io.Writer` is the interface with one method, `Write([]byte) (int, error)`. Files, network connections, `bytes.Buffer` and `strings.Builder` all implement it. `fmt.Printf(...)` is `fmt.Fprintf(os.Stdout, ...)`; give `Fprintf` your own writer first, and the same code can print, write a file or fill a buffer in a test.

For more information: https://pkg.go.dev/fmt#Fprintf"""

[[exercises]]
name = "io3"
path = "exercises/io/io3/main_test.go"
mode = "test"
nudge = """readLines returned no error for a line over 64 KiB: Scan stopped there, and the code treats that like the end of the input."""
stronger = """After the loop, ask the scanner for the error that stopped it and return it together with the lines, instead of nil."""
hint = """
`scanner.Scan()` returns false when it is done, and also when it failed. `scanner.Err()` returns the error, or nil at the end of the input. The default limit for a line is 64 KiB (`bufio.MaxScanTokenSize`); `scanner.Buffer` raises it. Always check `Err()` after the loop.

For more information: https://pkg.go.dev/bufio#Scanner.Err"""

[[exercises]]
name = "io4"
path = "exercises/io/io4/main_test.go"
mode = "test"
nudge = """All 11 bytes were copied: io.Copy copies until the end of the source, and nothing tells it to stop sooner."""
stronger = """Wrap src in the reader of the io package that gives out at most max bytes, and copy from that wrapper."""
hint = """
`io.LimitReader(r, n)` returns a reader that gives at most `n` bytes of `r` and then reports `io.EOF`. Combined with `io.Copy(dst, src)`, which copies until the end of `src` and returns the number of bytes, it limits a copy without any loop of your own.

For more information: https://pkg.go.dev/io#LimitReader"""

[[exercises]]
name = "io5"
path = "exercises/io/io5/main_test.go"
mode = "test"
nudge = """The hash is the one of empty input: the first copy used up src, so nothing was left for the second one."""
stronger = """Give io.Copy one destination that writes to both dst and h (the io package can combine writers), copy once, and remove the second copy."""
hint = """
A reader can be consumed once. Do both things in that one pass: `io.MultiWriter(dst, h)` is a writer that writes to every writer it was given, so `io.Copy(io.MultiWriter(dst, h), src)` copies and hashes together. `io.TeeReader(src, h)` does the same from the reading side. A hash implements `io.Writer`.

For more information: https://pkg.go.dev/io#MultiWriter"""

[[exercises]]
name = "io6"
path = "exercises/io/io6/main_test.go"
mode = "test"
nudge = """The result is empty: Read returns 0 bytes and io.EOF straight away, so the reader seems to have no data at all."""
stronger = """Call u.r.Read(p) and keep n and err. Change the first n bytes of p to capitals (the letters a to z only), and return n and err unchanged."""
hint = """
A `Reader` is any type with `Read(p []byte) (n int, err error)`. A reader that wraps another one calls the inner `Read(p)` and then works on `p[:n]`, only the bytes that were read: the rest of `p` is whatever it held before. Pass on `n` and `err` as they came, so the end of the input and any error reach the caller.

For more information: https://pkg.go.dev/io#Reader"""

[[exercises]]
name = "fs1"
