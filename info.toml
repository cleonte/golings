hint = """
`filepath.Join(dir, "../secret.txt")` is a path outside `dir`, and `os.ReadFile` is glad to read it. `os.OpenRoot(dir)` returns an `*os.Root` whose methods (`Open`, `ReadFile`, `Create`, ...) refuse any name that leaves the folder, through `..` or through a symbolic link. Close it when done.

For more information: https://pkg.go.dev/os#Root"""

[[exercises]]
