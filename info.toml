Embedding means writing a type name in a struct or interface without a field name. In a struct it promotes the methods of that type, and the embedded value is a field you can set by the type name: Service{Logger: Logger{...}}. In an interface it adds the methods of that interface.

For more information: https://go.dev/doc/effective_go#embedding"""

