hint = """
A middleware is a function that takes a handler and returns one. `http.Error` writes an answer but does not return from your function, so code after it still runs. After answering the unauthorized request, `return`, so `next.ServeHTTP` is only called for requests that passed the check.

For more information: https://pkg.go.dev/net/http#Error"""

[[exercises]]
