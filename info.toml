stronger = """In the walk function, when the entry is a folder named .git, return the value of io/fs that tells the walk to skip that folder."""
hint = """
A walk function can return `fs.SkipDir` to skip the rest of the folder it was called for (when the entry is a folder), or `fs.SkipAll` to stop the walk. Both are values from `io/fs`, and `filepath.WalkDir` understands them like `fs.WalkDir` does. Skipping a folder is much cheaper than visiting its files and ignoring them.

For more information: https://pkg.go.dev/io/fs#SkipDir"""

[[exercises]]
name = "fs4"
path = "exercises/fs/fs4/main_test.go"
mode = "test"
