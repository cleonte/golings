hint = """
`strconv.Atoi` returns an error for text that is not a number, and ignoring it gives 0. Check it, answer with `http.Error(w, message, http.StatusBadRequest)` and `return`. A 4xx status tells the client that the request was wrong, not the server.

For more information: https://pkg.go.dev/net/http#pkg-constants"""

[[exercises]]
name = "http5"
