hint = """
The slices package changes slices without you writing the loops: `slices.Insert(s, i, v...)` adds values at a position, `slices.Delete(s, i, j)` removes `s[i:j]`, and `slices.Compact(s)` removes runs of equal neighbours. They return the new slice, so keep the result: `s = slices.Delete(s, 1, 3)`.

For more information: https://pkg.go.dev/slices#Insert"""

