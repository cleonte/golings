A pattern passed to `fs.Glob(fsys, pattern)` is matched against paths from the root of `fsys`, and `*` does not cross a `/`. `fs.Sub(fsys, "assets/css")` returns a file system rooted at that sub-folder, so inside it `*.css` finds the style sheets and the names are relative to the folder.

For more information: https://pkg.go.dev/io/fs#Sub"""

[[exercises]]
