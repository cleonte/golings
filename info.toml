`logger.With("order_id", 7)` returns a new logger that adds those pairs to every record it writes, so you don't repeat them at each call. `slog.Group("customer", "name", "ana")` nests pairs under a name: the text handler writes `customer.name=ana`, the JSON handler an object.

For more information: https://pkg.go.dev/log/slog#Logger.With"""

