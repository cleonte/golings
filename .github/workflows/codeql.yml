name: codeql

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Mondays, so a new query or advisory is looked at weekly even when nothing was pushed.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: the workflow files themselves.
        language: [ "go", "actions" ]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      if: matrix.language == 'go'
      with:
        go-version-file: go.mod
        cache: true

    - uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # The exercises do not compile on purpose, so `go build ./...` (what
        # autobuild runs) fails: build the program, which is what ships.
        build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

    - name: Build golings
      if: matrix.language == 'go'
      run: go build -o /dev/null ./golings

    - uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
